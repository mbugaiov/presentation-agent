name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine smoke tests
        run: bash tests/run_tests.sh
      - name: Portability
        run: bash scripts/portability_check.sh
      - name: Projects isolation
        run: bash scripts/projects_isolation_check.sh
      - name: Review gate fixtures
        run: bash scripts/check_review_gate_fixtures.sh
